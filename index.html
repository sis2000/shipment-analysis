<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出貨與產能分析儀表板 - 每週視角</title>
  
  <!-- 載入 React 核心 (固定穩定版本 18.2.0) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel 解析 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 載入 Recharts 圖表庫與依賴 (降版至 2.1.12 最穩定的 UMD 版本) -->
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.1.12/umd/Recharts.js"></script>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell, ReferenceLine } = window.Recharts;

    // --- 圖示庫 (SVG) ---
    const AlertTriangle = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>;
    const TrendingUp = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
    const FileText = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
    const Package = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="16.5" x2="7.5" y1="9.4" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" x2="12" y1="22.08" y2="12"/></svg>;
    const Calendar = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const Settings2 = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>;
    const ChevronDown = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>;
    const ChevronRight = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
    const Calculator = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
    const Clock = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const LayoutGrid = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>;
    const CalendarDays = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>;
    const Download = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;

    // --- 主程式開始 ---
    const App = () => {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [expandedBrands, setExpandedBrands] = useState(new Set());
      
      const [pairsPerHour, setPairsPerHour] = useState(150);
      const [lineCount, setLineCount] = useState(4);
      const [hoursPerDay, setHoursPerDay] = useState(10);
      const [daysPerWeek, setDaysPerWeek] = useState(6);
      
      const capacity = useMemo(() => pairsPerHour * lineCount * hoursPerDay * daysPerWeek, [pairsPerHour, lineCount, hoursPerDay, daysPerWeek]);

      const handleCapacityChange = (newTotal) => {
        const divider = lineCount * hoursPerDay * daysPerWeek;
        if (divider > 0) setPairsPerHour(Math.round(newTotal / divider));
      };

      // 解析日期並分出「每週」的資訊
      const getWeekInfo = (dateStr) => {
        const d = new Date(dateStr);
        // 設定為該週週一
        const dayNum = d.getDay() || 7;
        d.setDate(d.getDate() - (dayNum - 1)); 
        
        const start = new Date(d);
        const end = new Date(d);
        end.setDate(d.getDate() + 6); // 該週週日
        
        const firstDayOfYear = new Date(d.getFullYear(), 0, 1);
        const pastDaysOfYear = (d - firstDayOfYear) / 86400000;
        const weekNum = Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        const formatDate = (date) => `${(date.getMonth() + 1).toString().padStart(2, '0')}/${date.getDate().toString().padStart(2, '0')}`;
        
        const wStr = weekNum.toString().padStart(2, '0');
        return {
          key: `${d.getFullYear()}-W${wStr}`,
          label: `W${wStr}`,
          range: `${formatDate(start)} - ${formatDate(end)}`,
          sortKey: d.getTime()
        };
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setLoading(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          parseCSV(event.target.result);
          setLoading(false);
        };
        reader.readAsText(file);
        e.target.value = null; // 允許重複上傳相同檔案
      };

      const parseCSV = (csvText) => {
        // 增強型 CSV 解析器：正確處理雙引號內的逗號
        const parseCSVLine = (text) => {
          let result = []; let curVal = ''; let inQuotes = false;
          for (let i = 0; i < text.length; i++) {
            if (text[i] === '"') inQuotes = !inQuotes;
            else if (text[i] === ',' && !inQuotes) { result.push(curVal.trim()); curVal = ''; }
            else curVal += text[i];
          }
          result.push(curVal.trim()); return result;
        };

        const lines = csvText.split('\n').filter(line => line.trim() !== '');
        if (lines.length === 0) return;
        const headers = parseCSVLine(lines[0]);
        
        const idxBrand = headers.findIndex(h => h.includes('品牌'));
        const idxStyle = headers.findIndex(h => h.includes('工厂型体') || h.includes('工廠型體'));
        const idxQty = headers.findIndex(h => h.includes('订单数量') || h.includes('訂單數量'));
        const idxDate = headers.findIndex(h => h.includes('确认出货日') || h.includes('確認出貨日'));

        const result = [];
        lines.slice(1).forEach(line => {
          const cols = parseCSVLine(line);
          const dateStr = cols[idxDate];
          if (!dateStr) return;
          const dateObj = new Date(dateStr);
          if (isNaN(dateObj.getTime())) return;
          const qty = parseInt(cols[idxQty]);
          if (isNaN(qty)) return;

          result.push({
            brand: cols[idxBrand]?.replace(/"/g, '') || 'Unknown',
            style: cols[idxStyle]?.replace(/"/g, '') || 'Unknown',
            qty: qty,
            ...getWeekInfo(dateStr)
          });
        });
        setData(result);
      };

      // 將資料以「週次」分組
      const reportData = useMemo(() => {
        if (data.length === 0) return { brands: [], weeks: [], chartData: [] };
        
        // 收集所有週次
        const weekMap = {};
        data.forEach(d => {
          if (!weekMap[d.weekKey]) weekMap[d.weekKey] = { key: d.weekKey, label: d.weekLabel, range: d.weekRange, sortKey: d.weekSortKey };
        });
        const sortedWeeks = Object.values(weekMap).sort((a, b) => a.sortKey - b.sortKey);
        
        // 依照品牌與週次歸戶資料
        const brandsMap = {};
        data.forEach(d => {
          if (!brandsMap[d.brand]) brandsMap[d.brand] = { name: d.brand, total: 0, weekly: {}, styles: {} };
          const b = brandsMap[d.brand];
          b.total += d.qty; 
          b.weekly[d.weekKey] = (b.weekly[d.weekKey] || 0) + d.qty;
          
          if (!b.styles[d.style]) b.styles[d.style] = { name: d.style, total: 0, weekly: {} };
          const s = b.styles[d.style];
          s.total += d.qty; 
          s.weekly[d.weekKey] = (s.weekly[d.weekKey] || 0) + d.qty;
        });

        // 長條圖資料
        const chartData = sortedWeeks.map(w => ({
          name: w.label, range: w.range,
          qty: data.filter(d => d.weekKey === w.key).reduce((sum, d) => sum + d.qty, 0)
        }));

        return { 
          brands: Object.values(brandsMap).sort((a, b) => b.total - a.total), 
          weeks: sortedWeeks, 
          chartData 
        };
      }, [data]);

      const toggleBrand = (brandName) => {
        const newSet = new Set(expandedBrands);
        if (newSet.has(brandName)) newSet.delete(brandName);
        else newSet.add(brandName);
        setExpandedBrands(newSet);
      };

      const getHeatColor = (val) => {
        if (!val || val === 0) return 'text-slate-200';
        if (val > capacity) return 'bg-rose-500 text-white font-bold animate-pulse';
        if (val > capacity * 0.8) return 'bg-orange-500 text-white font-bold';
        if (val > capacity * 0.3) return 'bg-indigo-500 text-white';
        return 'bg-indigo-100 text-indigo-800';
      };

      const exportToCSV = () => {
        if (!reportData || reportData.weeks.length === 0) return;
        let csvContent = '\uFEFF'; 
        const headers = ['客戶 / 品牌', '工廠型體', ...reportData.weeks.map(w => `${w.label} (${w.range})`), '總計'];
        csvContent += headers.map(h => `"${h}"`).join(',') + '\n';

        reportData.brands.forEach(brand => {
          const brandRow = [`"${brand.name}"`, '"[品牌小計]"'];
          reportData.weeks.forEach(w => brandRow.push(brand.weekly[w.key] || 0));
          brandRow.push(brand.total);
          csvContent += brandRow.join(',') + '\n';

          Object.values(brand.styles).forEach(style => {
            const styleRow = [`"${brand.name}"`, `"${style.name}"`];
            reportData.weeks.forEach(w => styleRow.push(style.weekly[w.key] || 0));
            styleRow.push(style.total);
            csvContent += styleRow.join(',') + '\n';
          });
        });

        const footerRow = ['"每週預計出貨總數"', '""'];
        reportData.weeks.forEach(w => {
          footerRow.push(data.filter(d => d.weekKey === w.key).reduce((sum, d) => sum + d.qty, 0));
        });
        footerRow.push(data.reduce((sum, d) => sum + d.qty, 0));
        csvContent += footerRow.join(',') + '\n';

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url;
        const today = new Date();
        const dateStr = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2,'0')}${today.getDate().toString().padStart(2,'0')}`;
        link.setAttribute('download', `出貨每週集中度報表_${dateStr}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen p-4 md:p-8 font-sans text-slate-900">
          <div className="max-w-[1600px] mx-auto mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold flex items-center gap-2 text-slate-800">
                <Calendar className="w-7 h-7 text-indigo-600" /> 出貨與產能分析儀表板
              </h1>
              <p className="text-slate-500 mt-1 font-medium italic">
                當前計算設定：{pairsPerHour}雙 × {lineCount}線 × {hoursPerDay}時 × {daysPerWeek}天 = {capacity.toLocaleString()} 雙/週
              </p>
            </div>
            
            <div className="flex flex-wrap items-center gap-3">
              {data.length > 0 && (
                <button onClick={exportToCSV} className="bg-white hover:bg-slate-50 text-indigo-600 border border-indigo-200 px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 font-bold shadow-sm">
                  <Download className="w-4 h-4" /> 匯出每週報表
                </button>
              )}
              <label className="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 shadow-lg shadow-indigo-200 font-bold">
                <FileText className="w-4 h-4" /> 上傳訂單 CSV
                <input type="file" className="hidden" accept=".csv" onChange={handleFileUpload} />
              </label>
            </div>
          </div>

          {data.length === 0 ? (
            <div className="max-w-xl mx-auto mt-20 p-16 bg-white rounded-3xl border border-slate-200 text-center shadow-xl shadow-slate-200/50">
              <div className="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <Package className="w-10 h-10 text-indigo-500" />
              </div>
              <h3 className="text-xl font-bold mb-3 text-slate-800">準備開始分析</h3>
              <p className="text-slate-500 leading-relaxed">請上傳訂單 CSV 檔案，系統將自動為您「以週為單位」整理出貨排程。</p>
            </div>
          ) : (
            <div className="max-w-[1600px] mx-auto space-y-6">
              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                  <div className="flex justify-between items-start">
                    <span className="text-slate-400 text-sm font-semibold uppercase tracking-wider">總訂單雙數</span>
                    <Package className="w-5 h-5 text-indigo-400" />
                  </div>
                  <div>
                    <div className="text-4xl font-black text-slate-800">{data.reduce((sum, d) => sum + d.qty, 0).toLocaleString()}</div>
                    <div className="text-xs text-slate-400 mt-1">涵蓋 {reportData.weeks.length} 個週次</div>
                  </div>
                </div>

                <div className="lg:col-span-3 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                   <div className="flex items-center justify-between mb-4">
                     <div className="flex items-center gap-2 text-rose-600">
                       <Settings2 className="w-4 h-4" />
                       <h3 className="text-sm font-bold uppercase tracking-wider">調整總產能上限</h3>
                     </div>
                     <div className="flex items-center gap-4">
                       <input type="range" min="5000" max="150000" step="100" value={capacity} onChange={(e) => handleCapacityChange(parseInt(e.target.value))} className="w-48 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-rose-500" />
                       <div className="flex items-center bg-rose-50 border border-rose-200 rounded-lg px-3 py-1">
                         <input type="number" value={capacity} onChange={(e) => handleCapacityChange(parseInt(e.target.value) || 0)} className="w-24 bg-transparent text-right font-black text-rose-600 focus:outline-none" />
                         <span className="ml-1 text-xs font-bold text-rose-400">雙/週</span>
                       </div>
                     </div>
                   </div>
                   <div className="h-32 w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={reportData.chartData}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                        <XAxis dataKey="name" axisLine={false} tickLine={false} fontSize={12} />
                        <YAxis hide domain={[0, dataMax => Math.max(dataMax, capacity) * 1.2]} />
                        <Tooltip 
                          cursor={{ fill: '#f8fafc' }}
                          content={({ active, payload }) => {
                            if (active && payload && payload.length) {
                              const val = payload[0].value; const isOver = val > capacity;
                              return (
                                <div className="bg-slate-900 text-white p-3 rounded-xl shadow-xl border border-slate-700 text-xs">
                                  <p className="font-bold mb-1">{payload[0].payload.name} ({payload[0].payload.range})</p>
                                  <p className="flex justify-between gap-4 mb-1">每週訂單: <span className={isOver ? 'text-rose-400' : 'text-emerald-400'}>{val.toLocaleString()} 雙</span></p>
                                  <p className="flex justify-between gap-4 text-slate-400">當前產能: <span>{capacity.toLocaleString()} 雙</span></p>
                                  {isOver && <p className="mt-2 text-[10px] bg-rose-500/20 text-rose-300 p-1 rounded border border-rose-500/30 text-center">超出每週能力範圍</p>}
                                </div>
                              );
                            }
                            return null;
                          }}
                        />
                        <ReferenceLine y={capacity} stroke="#f43f5e" strokeDasharray="5 5" strokeWidth={2} />
                        <Bar dataKey="qty" radius={[4, 4, 0, 0]}>
                          {reportData.chartData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.qty > capacity ? '#f43f5e' : '#6366f1'} />)}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                   </div>
                </div>
              </div>

              <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div className="p-6 border-b border-slate-50 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="p-2 bg-slate-100 rounded-lg"><TrendingUp className="w-5 h-5 text-slate-600" /></div>
                    <h2 className="font-bold text-lg text-slate-800">出貨週排程熱圖 (超標預警)</h2>
                  </div>
                  <div className="flex gap-4 items-center text-xs text-slate-400 font-medium">
                    <span className="flex items-center gap-1"><div className="w-3 h-3 bg-rose-500 rounded-sm"></div> 超產能</span>
                    <span className="flex items-center gap-1"><div className="w-3 h-3 bg-orange-500 rounded-sm"></div> 接近極限</span>
                    <span className="flex items-center gap-1"><div className="w-3 h-3 bg-indigo-500 rounded-sm"></div> 正常</span>
                  </div>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-50/80">
                        <th className="p-4 font-bold text-slate-500 border-b border-slate-100 sticky left-0 bg-slate-50 z-20 w-64">客戶品牌 / 工廠型體</th>
                        {/* 這裡就是每週分佈的欄位 */}
                        {reportData.weeks.map(w => (
                          <th key={w.key} className="p-4 border-b border-slate-100 text-center min-w-[140px]">
                            <div className="text-slate-800 font-bold">{w.label}</div>
                            <div className="text-[10px] text-slate-400 font-medium">{w.range}</div>
                          </th>
                        ))}
                        <th className="p-4 font-bold text-slate-500 border-b border-slate-100 text-right sticky right-0 bg-slate-50 z-20">總計</th>
                      </tr>
                    </thead>
                    <tbody>
                      {reportData.brands.map((brand) => {
                        const isExpanded = expandedBrands.has(brand.name);
                        return (
                          <React.Fragment key={brand.name}>
                            <tr onClick={() => toggleBrand(brand.name)} className="cursor-pointer hover:bg-slate-50/50 transition-colors">
                              <td className="p-4 border-b border-slate-50 sticky left-0 bg-white z-10 flex items-center gap-2 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">
                                {isExpanded ? <ChevronDown className="w-4 h-4 text-indigo-500" /> : <ChevronRight className="w-4 h-4 text-slate-400" />}
                                <span className="font-bold text-slate-700">{brand.name}</span>
                              </td>
                              {reportData.weeks.map(w => {
                                const val = brand.weekly[w.key] || 0;
                                return (
                                  <td key={w.key} className="p-2 border-b border-slate-50 text-center">
                                    {val > 0 && <div className={`py-2 px-1 rounded-lg text-[13px] transition-all shadow-sm ${getHeatColor(val)}`}>{val.toLocaleString()}</div>}
                                  </td>
                                );
                              })}
                              <td className="p-4 border-b border-slate-50 text-right font-black text-indigo-900 sticky right-0 bg-white z-10 shadow-[-2px_0_5px_-2px_rgba(0,0,0,0.05)]">{brand.total.toLocaleString()}</td>
                            </tr>
                            {isExpanded && Object.values(brand.styles).map((style) => (
                              <tr key={style.name} className="bg-slate-50/30 text-xs">
                                <td className="p-4 border-b border-slate-50 pl-10 sticky left-0 bg-slate-50/80 z-10 text-slate-500 italic">{style.name}</td>
                                {reportData.weeks.map(w => (
                                  <td key={w.key} className="p-2 border-b border-slate-50 text-center opacity-70 italic text-slate-400">{style.weekly[w.key] ? style.weekly[w.key].toLocaleString() : '-'}</td>
                                ))}
                                <td className="p-4 border-b border-slate-50 text-right text-slate-400 sticky right-0 bg-slate-50/80 z-10 italic">{style.total.toLocaleString()}</td>
                              </tr>
                            ))}
                          </React.Fragment>
                        );
                      })}
                    </tbody>
                    <tfoot className="bg-slate-900 text-white">
                      <tr>
                        <td className="p-4 font-bold text-center">每週預計出貨總數</td>
                        {reportData.weeks.map(w => {
                          const total = data.filter(d => d.weekKey === w.key).reduce((sum, d) => sum + d.qty, 0);
                          const isOver = total > capacity;
                          return (
                            <td key={w.key} className={`p-4 text-center font-black ${isOver ? 'text-rose-400 animate-pulse' : 'text-amber-400'}`}>
                              {total.toLocaleString()} {isOver && <div className="text-[10px] uppercase">Over!</div>}
                            </td>
                          );
                        })}
                        <td className="p-4 text-right font-black text-emerald-400 sticky right-0 bg-slate-900">{data.reduce((sum, d) => sum + d.qty, 0).toLocaleString()}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-12">
                <div className="bg-indigo-50 border border-indigo-100 p-6 rounded-2xl">
                  <div className="flex items-center gap-2 mb-4 text-indigo-900 font-bold">
                    <Calculator className="w-5 h-5" /> 產能計算基礎 (可手動修改欄位)
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm">
                      <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 flex items-center gap-1"><TrendingUp className="w-3 h-3" /> 單線效能 (雙/時)</div>
                      <input type="number" value={pairsPerHour} onChange={(e) => setPairsPerHour(parseInt(e.target.value) || 0)} className="w-full text-xl font-black text-indigo-600 focus:outline-none" />
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm">
                      <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 flex items-center gap-1"><LayoutGrid className="w-3 h-3" /> 成型線數 (條)</div>
                      <input type="number" value={lineCount} onChange={(e) => setLineCount(parseInt(e.target.value) || 0)} className="w-full text-xl font-black text-indigo-600 focus:outline-none" />
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm">
                      <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 flex items-center gap-1"><Clock className="w-3 h-3" /> 日工時 (小時)</div>
                      <input type="number" value={hoursPerDay} onChange={(e) => setHoursPerDay(parseInt(e.target.value) || 0)} className="w-full text-xl font-black text-indigo-600 focus:outline-none" />
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm">
                      <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 flex items-center gap-1"><CalendarDays className="w-3 h-3" /> 週工時 (天)</div>
                      <input type="number" value={daysPerWeek} onChange={(e) => setDaysPerWeek(parseInt(e.target.value) || 0)} className="w-full text-xl font-black text-indigo-600 focus:outline-none" />
                    </div>
                  </div>
                  <p className="mt-4 text-xs text-indigo-400 font-medium italic">* 這裡的數字與上方總產能水平線同步，任何一處修改都會即時連動。</p>
                </div>
                <div className="bg-rose-50 border border-rose-100 p-6 rounded-2xl">
                  <div className="flex items-center gap-2 mb-3 text-rose-900 font-bold"><AlertTriangle className="w-5 h-5" /> 分析與對策</div>
                  <ul className="text-sm text-rose-800 space-y-3 opacity-90 leading-relaxed">
                    <li className="flex gap-2"><span className="font-bold">•</span><span>當「每週」出貨量大於產能時，底部會顯示 <b className="text-rose-600">Over!</b>，請評估是否需調整該週工時或加班。</span></li>
                    <li className="flex gap-2"><span className="font-bold">•</span><span>透過修改「單線效能」，可以模擬當產線熟練度提高或技術改進後的每週排產狀況。</span></li>
                    <li className="flex gap-2"><span className="font-bold">•</span><span><b className="text-rose-600">匯出每週報表：</b> 可將此整理好的每週排程明細匯出為 Excel 支援的 CSV 檔，方便與各單位協調溝通。</span></li>
                  </ul>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
